<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="fa-solid fa-print"></i>
      <span>Nanba Billing</span>
    </div>
    <p class="login-sub">Sign in to your account</p>

    @if (error) {
      <div class="alert-error"><i class="fa-solid fa-circle-exclamation"></i> {{error}}</div>
    }

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input class="form-control" [(ngModel)]="username" name="username" placeholder="Enter username" required autocomplete="username" />
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input class="form-control" [(ngModel)]="password" name="password" [type]="showPwd ? 'text' : 'password'" placeholder="Enter password" required autocomplete="current-password" />
          <button type="button" class="eye-btn" (click)="showPwd = !showPwd">
            <i class="fa-solid" [class.fa-eye]="!showPwd" [class.fa-eye-slash]="showPwd"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary login-btn" [disabled]="loading">
        @if (loading) { <i class="fa-solid fa-spinner fa-spin"></i> } @else { <i class="fa-solid fa-right-to-bracket"></i> }
        Sign In
      </button>
    </form>

    <div class="login-hint">
      <small>Default: admin / admin123 &nbsp;|&nbsp; user1 / user123</small>
    </div>
  </div>
</div>
