<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fa-solid fa-print"></i>
        <span class="logo-text">Nanba</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          <i class="fa-solid {{item.icon}}"></i>
          <span>{{item.label}}</span>
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <span>Nanba Billing v1.0</span>
    </div>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <button class="toggle-btn-mobile" (click)="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topbar-title">Nanba Billing & Expense Management</div>
      <div class="topbar-right">
        <span class="date-badge"><i class="fa-regular fa-calendar"></i> {{today | date:'dd MMM yyyy'}}</span>
      </div>
    </header>
    <main class="content-area">
      <router-outlet />
    </main>
  </div>
</div>
