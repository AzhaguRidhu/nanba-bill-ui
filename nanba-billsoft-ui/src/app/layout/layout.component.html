<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen">
  <div class="sidebar-backdrop" (click)="toggleSidebar()"></div>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fa-solid fa-print"></i>
        <span class="logo-text">Nanba</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="closeSidebarOnMobile()">
          <i class="fa-solid {{item.icon}}"></i>
          <span>{{item.label}}</span>
        </a>
      }
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar"><i class="fa-solid fa-circle-user"></i></div>
      <div class="user-info">
        <div class="user-name">{{currentUser()?.name}}</div>
        <div class="user-role">{{currentUser()?.role === 'super' ? 'Super Admin' : 'User'}}</div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="toggle-btn-mobile" (click)="toggleSidebar()">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topbar-title">Nanba Billing & Expense Management</div>
      <div class="topbar-right">
        <span class="date-badge"><i class="fa-regular fa-calendar"></i> {{today | date:'dd MMM yyyy'}}</span>
        <button class="btn btn-secondary btn-sm topbar-logout" (click)="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>
    <main class="content-area">
      <router-outlet />
    </main>
  </div>
</div>
